server {
    listen 80;
    server_name _;   # oder dein Domainname
    root /var/www/html/public;

    index index.php;

    # Logfiles
    access_log /var/log/nginx/symfony_access.log;
    error_log /var/log/nginx/symfony_error.log;

    # .well-known für Certbot erlauben
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    # Versteckte Dateien sperren
    location ~ /\. {
        deny all;
    }

    # Statische Assets direkt ausliefern
    location ~* \.(jpg|jpeg|gif|png|svg|ico|css|js|woff|woff2|ttf|map)$ {
        expires 6M;
        access_log off;
        try_files $uri =404;
    }

    # Symfony Front Controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP Durchleitung
    location ~ \.php$ {
        include fastcgi_params;

        # Wichtig: korrektes Document Root
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # PHP-FPM Socket (prüfen!)
        fastcgi_pass scrumpoker_symfony:9000;

        # Buffer settings
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;

        internal;
    }

    # Security Headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
}