version: '3.8'

services:
  # ----------------
  # React Frontend
  # ----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scrumpoker_frontend
    ports:
      - "8082:80"
    working_dir: /app
    volumes:
      - ./frontend:/app
    networks:
      - scrumpoker_net

  # ----------------
  # Symfony (PHP-FPM)
  # ----------------
  symfony:
    build:
      context: ./symfony
      dockerfile: Dockerfile
    container_name: scrumpoker_symfony
    working_dir: /var/www/html
    volumes:
      - ./symfony:/var/www/html
    environment:
      PHP_DISPLAY_ERRORS: 1
      PHP_MEMORY_LIMIT: 512M
    networks:
      - scrumpoker_net


  # ----------------
  # Nginx für Symfony
  # ----------------
  nginx_symfony:
    image: nginx:stable-alpine
    container_name: scrumpoker_nginx_symfony
    ports:
      - "8083:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./symfony:/var/www/html:ro
    depends_on:
      - symfony
    networks:
      - scrumpoker_net

  # ----------------
  # Websocket Server (Node.js + TypeScript)
  # ----------------
  ws:
    build:
      context: ./ws
      dockerfile: Dockerfile
    container_name: scrumpoker_ws
    working_dir: /usr/src/app
    volumes:
      - ./ws:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install --silent || true && npm run start:dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: user
      DATABASE_PASSWORD: 123
      DATABASE_NAME: scrumpoker
    depends_on:
      - mysql
    networks:
      - scrumpoker_net

  # ----------------
  # MySQL (App Database)
  # ----------------
  mysql:
    image: mysql:8.0
    container_name: scrumpoker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: scrumpoker
      MYSQL_USER: user
      MYSQL_PASSWORD: 123
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - scrumpoker_net

  # ----------------
  # Postgres (Keycloak)
  # ----------------
  keycloak-postgres:
    image: postgres:15
    container_name: scrumpoker_keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - scrumpoker_net

  # ----------------
  # Keycloak (Identity Provider)
  # ----------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: scrumpoker_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-postgres
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - scrumpoker_net

networks:
  scrumpoker_net:
    driver: bridge

volumes:
  mysql_data:
  keycloak_db_data:
  keycloak_data:
