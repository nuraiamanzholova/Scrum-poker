knpu_oauth2_client:
  clients:
    keycloak:
      type: keycloak
      auth_server_url: "http://localhost:8081"
      realm: "symfony-backend"
      client_id: "symfony-backend"
      client_secret: "%env(OAUTH_KEYCLOAK_CLIENT_SECRET)%"
      redirect_route: connect_keycloak_check
      use_state: true
