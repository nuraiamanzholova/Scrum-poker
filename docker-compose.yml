version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: scrumpoker_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules

  symfony:
    build:
      context: ./symfony3
      dockerfile: Dockerfile
    container_name: scrumpoker_symfony
    working_dir: /var/www/html
    volumes:
      - ./symfony:/var/www/html
      - /var/www/html/vendor
    environment:
      PHP_DISPLAY_ERRORS: 1
      PHP_MEMORY_LIMIT: 512M
    

  nginx_symfony:
    image: nginx:stable-alpine
    container_name: scrumpoker_nginx_symfony
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./symfony:/var/www/html:ro
    depends_on:
      - symfony
  

  ws:
    build:
      context: ./ws
      dockerfile: Dockerfile
    container_name: scrumpoker_ws
    working_dir: /usr/src/app
    volumes:
      - ./ws:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install --silent || true && npm run start:dev"
    environment:
      NODE_ENV: development
      DATABASE_HOST: localhost
      DATABASE_PORT: 3306
      DATABASE_USER: user
      DATABASE_PASSWORD: 123
      DATABASE_NAME: scrumpoker
    depends_on:
      - mysql
  

  mysql:
    image: mysql:8.0
    container_name: scrumpoker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: scrumpoker
      MYSQL_USER: user
      MYSQL_PASSWORD: 123
    volumes:
      - mysql_data:/var/lib/mysql
  

  keycloak-postgres:
    image: postgres:15
    container_name: scrumpoker_keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
  

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: scrumpoker_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      - keycloak-postgres
    volumes:
      - keycloak_data:/opt/keycloak/data
  

volumes:
  mysql_data:
  keycloak_db_data:
  keycloak_data:
