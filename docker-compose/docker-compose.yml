version: '3.8'

services:
  # ----------------
  # Frontend (Vite + React)
  # ----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scrumpoker_frontend
    working_dir: /app
    command: sh -c "npm run build"
    volumes:
      - ./frontend:/app
    networks:
      - scrumpoker_net

  # ----------------
  # nginx als Reverse Proxy / static server
  # ----------------
  nginx:
    image: nginx:stable-alpine
    container_name: scrumpoker_nginx
    ports:
      - "8082:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - ws
    networks:
      - scrumpoker_net

  # ----------------
  # Websocket server (Node.js + TypeScript)
  # ----------------
  ws:
    build:
      context: ./ws
      dockerfile: Dockerfile
    container_name: scrumpoker_ws
    working_dir: /usr/src/app
    volumes:
      - ./ws:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install --silent || true && npm run start:dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=user
      - DATABASE_PASSWORD=123
      - DATABASE_NAME=scrumpoker
    depends_on:
      - mysql
    networks:
      - scrumpoker_net

  # ----------------
  # MySQL: App database
  # ----------------
  mysql:
    image: mysql:8.0
    container_name: scrumpoker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: scrumpoker
      MYSQL_USER: user
      MYSQL_PASSWORD: 123
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - scrumpoker_net

  # ----------------
  # Postgres for Keycloak
  # ----------------
  keycloak-postgres:
    image: postgres:15
    container_name: scrumpoker_keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - scrumpoker_net

  # ----------------
  # Keycloak (Identity Provider)
  # ----------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: scrumpoker_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-postgres
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - scrumpoker_net

networks:
  scrumpoker_net:
    driver: bridge

volumes:
  mysql_data:
  keycloak_db_data:
  keycloak_data:
